name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      # Build the native Android project on the GitHub runner.
      # This avoids requiring an Expo/EAS account or EXPO_TOKEN for the MVP APK.
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --no-install

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        run: find android/app/build/outputs/apk -type f -name '*.apk' -print

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoFilm-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
